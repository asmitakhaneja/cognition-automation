name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

defaults:
  run:
    working-directory: devin-observability-dashboard

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: devin-observability-dashboard/backend
        run: pip install -r requirements-dev.txt
      - name: Lint (black + flake8)
        working-directory: devin-observability-dashboard/backend
        run: |
          black --check app tests
          flake8 app tests
      - name: Run tests
        working-directory: devin-observability-dashboard/backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: devin-observability-dashboard/frontend
        run: npm ci
      - name: Typecheck & build
        working-directory: devin-observability-dashboard/frontend
        run: npm run build
